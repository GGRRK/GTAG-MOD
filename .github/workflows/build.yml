name: Build mod DLL

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build (Release)
        run: dotnet build -c Release --no-restore

      - name: Upload DLL as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: GTagCameraMod-dll
          path: bin/Release/net472/GTagCameraMod.dll
          if-no-files-found: error
          retention-days: 30

      # Only runs when we push a tag like v0.2.0 — creates a GitHub Release with the DLL attached
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          files: bin/Release/net472/GTagCameraMod.dll
          generate_release_notes: true
          fail_on_unmatched_files: true
